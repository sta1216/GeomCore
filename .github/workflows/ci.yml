name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DGEOM_WERROR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo -j 4
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  # Coverage is measured on Linux with GCC's gcov runtime and gcovr. Thresholds
  # follow docs/quality/testing-strategy.md section 2: global line 90 / branch
  # 85, and line 95 / branch 90 for core|numeric|primitives|curves|surfaces.
  # tests/, third_party/ and the coverage build tree are excluded so the gate
  # only scores library code.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure
        run: cmake -S . -B build-cov -DGEOM_COVERAGE=ON -DGEOM_WERROR=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-cov -j 4
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      - name: Coverage summary by file (branch)
        run: |
          gcovr -r . --gcov-ignore-parse-errors negative_hits.warn_once_per_file --exclude 'tests/' --exclude 'third_party/' --exclude 'build-cov/' \
                --csv -o coverage.csv
          python3 - <<'PY'
          import csv
          rows, covered_sum, total_sum = [], 0, 0
          for r in csv.DictReader(open('coverage.csv')):
              total = int(r['branch_total'])
              if not total:
                  continue
              covered = int(r['branch_covered'])
              covered_sum += covered
              total_sum += total
              rows.append((100.0 * covered / total, r['filename'], covered, total))
          rows.sort()
          for pct, name, cov, total in rows[:30]:
              print(f"{pct:6.1f}% {cov:5d}/{total:<5d} {name}")
          print(f"TOTAL {covered_sum} {total_sum} ({100.0*covered_sum/total_sum:.1f}%)")
          PY
      - name: Coverage JSON (per line)
        run: |
          gcovr -r . --gcov-ignore-parse-errors negative_hits.warn_once_per_file --exclude 'tests/' --exclude 'third_party/' --exclude 'build-cov/' \
                --json-pretty -o coverage.json
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
      - name: Coverage gate (global)
        run: |
          gcovr -r . --gcov-ignore-parse-errors negative_hits.warn_once_per_file --fail-under-line 90 --fail-under-branch 85 \
                --exclude 'tests/' --exclude 'third_party/' --exclude 'build-cov/' \
                --print-summary
      - name: Coverage gate (core modules)
        run: |
          gcovr -r . --gcov-ignore-parse-errors negative_hits.warn_once_per_file --filter 'include/geom/(core|numeric|primitives|curves|surfaces)/' \
                --fail-under-line 95 --fail-under-branch 90 \
                --exclude 'tests/' --exclude 'third_party/' --exclude 'build-cov/' \
                --print-summary
      - name: Coverage gate (cgeom and index)
        run: |
          gcovr -r . --gcov-ignore-parse-errors negative_hits.warn_once_per_file --filter 'include/geom/(cgeom|index)/' \
                --fail-under-line 90 --fail-under-branch 85 \
                --exclude 'tests/' --exclude 'third_party/' --exclude 'build-cov/' \
                --print-summary

  # QA-2: the read-only query paths (BVH/KD) must be race-free. The local MSVC
  # build can only run the serial-vs-parallel consistency assertion; TSan needs
  # a GCC/Clang toolchain, so it runs here.
  tsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tsan -DGEOM_TSAN=ON -DGEOM_WERROR=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build-tsan -j 4
      - name: QA-2 concurrency under TSan
        run: ./build-tsan/tests/geom_tests --test-case="qa2*"
